{% assign news = site.data.news | sort: "date" | reverse %}
{% assign tags = news | map: "tag" | uniq %}
<section class="home-section" aria-labelledby="news-h">
  <div class="home-h2-row">
    <h2 id="news-h" class="home-h2">News</h2>
    <div class="news-filter" role="group" aria-label="Filter news">
      <button type="button" class="news-tag news-tag--all is-active" data-filter="all" aria-pressed="true">all</button>
      {% for t in tags %}<button type="button" class="news-tag news-tag--{{ t }}" data-filter="{{ t }}" aria-pressed="false">{{ t }}</button>{% endfor %}
    </div>
  </div>
  <div class="news-feed" tabindex="0" aria-label="News, newest first">
    <ul>
    {% for item in news %}
      <li class="news-item" data-tag="{{ item.tag }}">
        <time datetime="{{ item.date | date: '%Y-%m-%d' }}">{{ item.date | date: "%b %Y" }}</time>
        <button type="button" class="news-tag news-tag--{{ item.tag }}" data-filter="{{ item.tag }}" title="Show only {{ item.tag }} news">{{ item.tag }}</button>
        <span class="news-text">{{ item.text }}{% if item.cta_url %} <a class="news-cta" href="{{ item.cta_url }}">{{ item.cta_text }}</a>{% endif %}</span>
      </li>
    {% endfor %}
    </ul>
  </div>
</section>
<script>
(function () {
  var root = document.getElementById('news-h').closest('section');
  var items = root.querySelectorAll('.news-item');
  var bar = root.querySelectorAll('.news-filter .news-tag');
  function apply(tag) {
    items.forEach(function (li) {
      var show = tag === 'all' || li.dataset.tag === tag;
      li.style.display = show ? '' : 'none';   /* inline style beats any CSS rule */
      li.setAttribute('aria-hidden', show ? 'false' : 'true');
    });
    bar.forEach(function (b) {
      var on = b.dataset.filter === tag;
      b.classList.toggle('is-active', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }
  root.addEventListener('click', function (e) {
    var b = e.target.closest('[data-filter]');
    if (!b) return;
    var tag = b.dataset.filter;
    var current = root.querySelector('.news-filter .is-active');
    apply(current && current.dataset.filter === tag && tag !== 'all' ? 'all' : tag);
    root.querySelector('.news-feed').scrollTop = 0;
  });
})();
</script>
