<section class="home-section home-section--wide" aria-labelledby="research-h">
  <div class="home-h2-row">
    <h2 id="research-h" class="home-h2">Research</h2>
    <a class="more-link" href="/research/">All publications {% include icons/arrow.svg %}</a>
  </div>
  <ul class="ptable">
  {% for f in site.data.featured %}
    {% assign permalink = "/publication/" | append: f %}
    {% assign pub = site.publications | where: "permalink", permalink | first %}
    {% if pub %}{% include paper-row.html pub=pub %}{% endif %}
  {% endfor %}
  </ul>
</section>
