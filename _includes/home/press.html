{% assign aw = site.data.awards %}
<section class="home-section" id="awards" aria-labelledby="awards-h">
  <h2 id="awards-h" class="home-h2">Awards</h2>
  <div class="award-photos">
    {% for ph in aw.photos %}
    <figure>
      <picture>
        {% if ph.webp %}<source srcset="{{ base_path }}/images/{{ ph.webp }}" type="image/webp">{% endif %}
        <img src="{{ base_path }}/images/{{ ph.image }}" alt="{{ ph.alt }}" loading="lazy" decoding="async">
      </picture>
      <figcaption>{{ ph.caption }}</figcaption>
    </figure>
    {% endfor %}
    <p class="award-photos__note">{{ aw.photos_note }}</p>
  </div>
  <ul class="rows">
  {% for r in aw.rows %}{% include home/row.html r=r %}{% endfor %}
  </ul>
</section>

<section class="home-section" id="press" aria-labelledby="press-h">
  <h2 class="home-h2" id="press-h">Press &amp; Media</h2>
  <ul class="rows">
  {% for r in site.data.press %}{% include home/row.html r=r %}{% endfor %}
  </ul>
</section>
