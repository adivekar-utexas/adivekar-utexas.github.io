  - slug: "ioai-2025"
    kicker: "IOAI 2025 · Beijing, China"
    title: "Team Lead, Team India"
    expand: true
    text:
      - "I served as Team Lead (Olympiad Coach) for Team India at its debut participation at the International Olympiad in AI (IOAI). I helped select, mentor and coach the AI olympians, ran timed six-hour mock contests, and represented India at the IOAI General Assembly. I also designed Team India's peacock logo (right; each feather represents one olympian who participated in 2025)."
    summary: "The team of 8 won 6 medals, placing 3rd of 63 countries."
    meta: "Golds: Roumak Das (rank 11), Arjun Tyagi (18), Soham Sen (19). Silvers: Rayan Banerjee (37), Samik Goyal (41). Bronze: Himaneesh Sompalle (77). Honorable Mention: Ishaan Gangwani (152)."
