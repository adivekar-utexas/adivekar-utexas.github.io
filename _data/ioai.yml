#   expand: false      no chevron; everything is visible
#   more_image: x.jpg  expanding shows that image full width
#   image_right: x.jpg a small image on the right, above the buttons
intro: "The [International Olympiad in Artificial Intelligence (IOAI) [[ARROW]]](https://ioai-official.org/) is an annual science olympiad for high-school students. Its third edition, IOAI 2026 in Astana, Kazakhstan, had 108 countries and territories represented, and was the first to include an AI Models Track."
cards:
  - slug: "ioai-2026"
    kicker: "IOAI 2026 · Astana, Kazakhstan"
    title: "Chair of IOAI²: AI Models Track; member of IOAI 2026 Scientific Committee"
    expand: true
    text:
      - "As an ISC member, I helped propose and curate the IOAI 2026 tasks and served on the IOAI Jury in Astana, which proctored the competition."
      - "I also co-created and chaired the inaugural IOAI²: AI Models Track, and led its organizing committee. This first-of-its-kind competition measured the ability of agentic AI systems to solve our Olympiad-level ML modeling tasks, fully autonomously and with no human intervention. As chair, I spearheaded recruitment of 14 AI research organizations participating in the track across 3 continents, including UCLA, Peking University, Sakana AI, MBZUAI IFM, Shanghai AI Laboratory, Darwin Robotics and several AI neolabs. I led development of rules and proctoring of the track, announced medals, and co-wrote the final report with co-founder and Chair of the IOAI Board, Elena Marinova."
    show_all_text: true
    links:
