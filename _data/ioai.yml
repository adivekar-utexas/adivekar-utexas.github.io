# Homepage "AI Olympiad" section. Rendered by _includes/home/ioai-card.html and llms.txt.
# Cards use the publication card layout: image left, text centre, buttons right.
#   expand: false      no chevron; everything is visible
#   more_image: x.jpg  expanding shows that image full width
#   image_right: x.jpg a small image on the right, above the buttons
intro: "The [International Olympiad in Artificial Intelligence (IOAI)](https://ioai-official.org/) is an annual science olympiad for high-school students. Its third edition, IOAI 2026 in Astana, Kazakhstan, had 108 countries and territories represented, and was the first to include an AI Models Track."
cards:
  - slug: "ioai-2026"
    kicker: "IOAI 2026 · Astana, Kazakhstan"
    title: "Chair, IOAI²: AI Models Track; Member, Scientific Committee"
    expand: true
    text:
      - "I created and chaired the inaugural IOAI² AI Models Track and led its organizing committee. I designed the competition format and rules, and recruited 14 AI research organizations from 5 countries (United States, China, United Kingdom, Japan and the UAE), including Sakana AI, MBZUAI IFM, Shanghai AI Laboratory, Peking University, Westlake University and UCLA. Their 15 autonomous AI systems competed on the same six tasks as students from 108 countries and territories."
      - "The AI systems solved the same tasks as the students, but in a separate track with its own ranking and medals. I wrote the track's official statement and am lead author, with IOAI co-founder and Chair of the Board Elena Marinova, of the inaugural review. The International Jury's final report at the closing ceremony presented the track and gave special thanks to me and to Kaggle."
      - "I have been part of the International Scientific Committee's subcommittee on the AI Models Track, which I chaired in 2026, and I sat on the IOAI Jury in my capacity as a member of the ISC."
    links:
      - {label: "IOAI 2026 Team", url: "https://ioai-official.org/republic-of-kazakhstan/international-jury/"}
      - {label: "IOAI² Page", url: "https://ioai-official.org/ai-models-track/"}
      - {label: "IOAI² Results", url: "https://ioai-official.org/ai-models-track/ioai%C2%B2-2026-report/"}
      - {label: "IOAI² GitHub", url: "https://github.com/IOAI-official/IOAI-AI-Models-Track"}
    image: "ioai-2026-founding-ai-participants.jpg"
    image_alt: "The founding AI participants of the IOAI² AI Models Track: logos of the 15 participating AI labs and teams"
    more_image: "ioai-2026-founding-ai-participants.jpg"
    more_image_alt: "The founding AI participants of the IOAI² AI Models Track: logos of the 15 participating AI labs and teams"
  - slug: "ioai-2025"
    kicker: "IOAI 2025 · Beijing, China"
    title: "Team Lead, Team India"
    expand: true
    text:
      - "I served as Team Lead (Olympiad Coach) for Team India at its debut participation at the International Olympiad in AI (IOAI). I helped select, mentor and coach the AI olympians, ran timed six-hour mock contests, and represented India at the IOAI General Assembly. I also designed the team's peacock logo (one feather per olympian)."
    summary: "The team of 8 won 6 medals, placing 3rd of 63 countries."
    meta: "Golds: Roumak Das (rank 11), Arjun Tyagi (18), Soham Sen (19). Silvers: Rayan Banerjee (37), Samik Goyal (41). Bronze: Himaneesh Sompalle (77). Honorable Mention: Ishaan Gangwani (152)."
    press_id: "ioai-2025"
