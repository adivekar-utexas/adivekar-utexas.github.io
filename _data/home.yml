# Homepage prose shared by the HTML and llms.txt (Markdown allowed).
# [[TITLE]] is replaced by the job title and [[ARROW]] by the CTA arrow glyph
# (_data/ui.yml), so neither is hardcoded here.
hero:
  - "I research LLM evaluation, synthetic data, red-teaming LLMs and multimodal agents for science, with first-author papers at NeurIPS, ACL, EMNLP, AAAI, and CIKM. I collaborate with researchers at UT Austin, NYU and MBZUAI. At Amazon, I turn that research into products, including leading red-teaming and evals for the India launch of Amazon Rufus, [used by 100M+ customers [[ARROW]]](https://www.aboutamazon.in/news/retail/rufus-ai-shopping-assistant-launch-in-india)."
  - "My scientific and mathematical contributions have added over USD 550 million to Amazon's revenue between 2021-2026. I have deep industry experience working across several areas of e-commerce science; this includes building RL environments for LLM post-training, Search and Ads Ranking, Online advertising auction simulators, LLM-as-a-Judge, user-facing chatbot applications (Rufus), and LLM red-teaming & guardrails. I have shipped 650,000 lines of code into production (~500k was written pre-LLMs), including distributed language model training. My current favorite language model is Claude Opus 5.5 (high effort)."
  - "I volunteer on the Scientific Committee of the International Olympiad in AI (IOAI 2026 & 2027), where I chaired the inaugural [IOAI²: AI Models Track [[ARROW]]](https://ioai-official.org/ai-models-track/), a first-of-its-kind competition where I recruited 14 AI labs from industry and academia to solve AI Olympiad problems using fully autonomous agentic systems. Previously, I served as India's Team Lead (AI Olympiad Coach) at IOAI 2025, leading a team of 8 students to win 3 Gold, 2 Silver, 1 Bronze medals, and 1 Honorable Mention."
  - "I hold an M.S. in Computer Science from UT Austin, where I was advised by [Greg Durrett [[ARROW]]](https://gregdurrett.github.io/)."
amlc_intro: "AMLC is Amazon's annual internal machine learning conference, with roughly 1,000 submissions a year ([announcement](https://www.amazon.science/videos-webinars/amazons-annual-machine-learning-conference-featured-presentations-from-thought-leaders-within-academia)). Full texts are internal."
oss_intro: "I led the open-sourcing of FMCore, Bears and Concurry on Amazon Science."
history_note: "Opinions on this site are my own and do not reflect the views of my employer."
